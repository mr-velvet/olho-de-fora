# O OLHO DE FORA — vigia os serviços críticos da agnts DE FORA da máquina deles.
#
# ─── Por que este repositório é separado, e público ─────────────────────────
#
# 26/09/2026: o Hub da agnts ficou 2h19 fora do ar por uma publicação que subiu
# uma imagem que não liga, e ninguém foi avisado. O vigia da casa funcionou como
# projetado — e tentou avisar 28 vezes PELO PRÓPRIO HUB CAÍDO. O alarme tocou
# dentro do prédio em chamas.
#
# Depois daquilo a casa ganhou um vigia com saída própria, autocura com limites
# e um livro de disponibilidade. Tudo isso mora DENTRO da VM. Se a VM inteira
# desaparecer — pane de máquina, rede, zona — as três peças somem juntas.
#
# Este repositório é a peça que não compartilha o destino do que ela vigia:
#
#   SEPARADO do monorepo, porque um vigia que depende do CI, do histórico ou da
#   saúde do vigiado é o defeito de 26/09 em outra forma. Se o monorepo estiver
#   quebrado, travado ou no meio de uma migração, este continua olhando.
#
#   PÚBLICO, porque em repositório público o Actions é ilimitado e gratuito. Em
#   privado a cota é 2.000 min/mês e o GitHub cobra por minuto INICIADO: um
#   job de 25 s a cada 5 min custa 8.640 min/mês, 4,3x a cota. Não existe
#   intervalo útil que caiba. A régua do founder é custo zero, então a resposta
#   foi mudar a casa, não piorar o intervalo.
#
#   E pode ser público sem custo de segredo: o que está aqui é uma lista de URLs
#   que já são públicas e a lógica de quando avisar. As credenciais moram em
#   secrets, que o GitHub não expõe. Ele não tem acesso à máquina e não tem
#   poder sobre nada — só ENXERGA e FALA.
#
# ─── Segredos necessários (Settings → Secrets and variables → Actions) ──────
#
#   TELEGRAM_BOT_TOKEN  o bot da porta
#   TELEGRAM_CHAT_ID    o chat do founder
#   RESEND_API_KEY      a chave de envio do agnts
#   FOUNDER_EMAIL       para onde o e-mail vai
#
# Telegram e e-mail são independentes. Se as DUAS falharem a execução falha de
# propósito: verde com o aviso perdido no vazio é 26/09 se repetindo em silêncio.

name: olho de fora

on:
  schedule:
    # A cada 5 minutos — o mínimo que o GitHub aceita.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      seco:
        description: 'só sondar e imprimir, sem avisar ninguém nem tocar na issue'
        type: boolean
        default: false

# Uma execução de cada vez. Sem isso, um runner atrasado e o seguinte gravam
# estado em cima um do outro e a escada de avisos se corrompe — o pior modo de
# falha aqui, porque produz spam ou silêncio sem que ninguém perceba.
concurrency:
  group: olho-de-fora
  cancel-in-progress: false

permissions:
  # Só isto. A issue é o estado e o registro; nada mais é necessário e nada mais
  # é concedido. O poder de um workflow agendado é o teto do dano possível.
  issues: write
  contents: read

jobs:
  olhar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: as regras do aviso se provam antes de qualquer aviso sair
        # 24 testes, sem rede e sem banco, ~0,3 s. Um olho de fora com a escada
        # de avisos quebrada é pior que nenhum: ele grita, é silenciado, e some.
        run: node --test .

      - name: olhar de fora
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FOUNDER_EMAIL: ${{ secrets.FOUNDER_EMAIL }}
        run: node olho.mjs ${{ inputs.seco && '--seco' || '' }}
